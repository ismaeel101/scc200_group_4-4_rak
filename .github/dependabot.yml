version: 2
name: Dependency audit (pip-audit & npm audit)
# Not finished 
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1' # weekly on Monday at 03:00 UTC

permissions:
  contents: read
  actions: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit against backend/requirements.txt
        working-directory: ./backend
        run: |
          if [ -f requirements.txt ]; then
            echo "Running pip-audit..."
            pip-audit --progress-spinner off -r requirements.txt || {
              echo "pip-audit found vulnerabilities"
              exit 1
            }
          else
            echo "No backend/requirements.txt found — skipping pip-audit"
          fi

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run npm audit (fail on moderate+)
        working-directory: ./frontend
        run: |
          echo "Running npm audit (failing on moderate or higher)..."
          # npm audit exits non-zero on vulnerabilities at or above the given audit-level
          npm audit --audit-level=moderate || {
            echo "npm audit found vulnerabilities (moderate or higher)"
            exit 1
          }